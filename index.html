<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My 100</title><style> *{box-sizing:border-box}body{margin:0;background:#eae5d9;color:#373d32;font:15px Arial}header,nav{background:#faf6eb;padding:18px;text-align:center}header b{font:bold 40px Georgia;letter-spacing:-3px}small{color:#77776a}main{max-width:560px;margin:auto;padding:20px 18px 90px}article{background:#fffaf0;padding:24px;margin:0 0 22px;box-shadow:0 3px 9px #0001;border:1px solid #ddd3c2}h1,h2{font:normal 36px Georgia;margin:12px 0}p.entry{font:italic 17px/30px Georgia;white-space:pre-wrap;background:repeating-linear-gradient(transparent 0 29px,#ded7c8 30px)}button{cursor:pointer;border:1px solid #bcbca9;background:#faf6eb;color:inherit;border-radius:5px;padding:9px;margin:3px}button.primary{background:#63765b;color:white}nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:center;gap:8px;border-top:1px solid #ccc}input,textarea,select{width:100%;padding:12px;margin:7px 0 17px;border:1px solid #ccc5b5;background:#fffdf6;font:inherit}label{font-weight:bold}.photo{position:relative;background:white;padding:8px 8px 23px;margin:24px 8px;transform:rotate(-2deg);box-shadow:0 3px 6px #0002}.photo img,.photo svg{width:100%;height:200px;object-fit:cover;display:block}.tape{position:absolute;width:55px;height:18px;background:#c9b48caa}.tl{top:0;left:-12px;transform:rotate(-35deg)}.tr{top:0;right:-12px;transform:rotate(35deg)}.bl{bottom:0;left:-12px;transform:rotate(35deg)}.br{bottom:0;right:-12px;transform:rotate(-35deg)}.stamp{display:inline-block;border:2px dashed #78866c;padding:8px;color:#63765b;transform:rotate(-4deg);font-size:12px}.slot{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;padding:9px 0}.actions{border-top:1px solid #ddd;margin-top:20px;padding-top:8px} </style><header><b>my 100.</b><br><small>A LIFE IN A HUNDRED DREAMS</small></header><main id="main"></main><nav><button onclick="go('home')">⌂ Home</button><button onclick="go('explore')">◎ Explore</button><button onclick="go('create')">＋ New dream</button><button onclick="go('journal')">▤ My 100</button></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem('my100'))}catch{}state=state||{mine:[],likes:[],saved:[],follows:[],comments:{}};const samples=[{id:'a',user:'amelia.w',num:12,title:'See Europe',entry:'A summer wandering through little European towns, with a backpack and a camera.',status:'Dreaming',category:'Travel',likes:128,art:true},{id:'b',user:'james.travels',num:7,title:'See the northern lights',entry:'I finally stood beneath the Icelandic sky. A moment I will never forget.',status:'Completed',category:'Adventure',likes:246},{id:'c',user:'sophie.m',num:23,title:'Write my own book',entry:'One day I want to hold a book filled with my own words.',status:'Dreaming',category:'Creativity',likes:87}];let page='home',tab='Discover',edit=null,seed={},comment=null;const all=()=>[...state.mine,...samples],free=()=>Array.from({length:100},(_,i)=>i+1).find(n=>!state.mine.some(p=>p.num===n));function persist(){try{localStorage.setItem('my100',JSON.stringify(state))}catch{alert('Storage is full. Your latest changes may not survive a reload.')}}function go(p){page=p;edit=null;seed={};render();scrollTo(0,0)}function toggle(k,id){state[k]=state[k].includes(id)?state[k].filter(x=>x!==id):[...state[k],id];persist();render()}function photo(p){return p.photo||p.art?`<div class="photo">${p.photo?`<img src="${esc(p.photo)}" alt="Dream photo">`:'<svg viewBox="0 0 400 200"><rect width="400" height="200" fill="#c5d5d6"/><path d="M0 120Q100 20 200 100T400 80V200H0" fill="#87977b"/><path d="M0 160Q180 130 400 155V200H0" fill="#8aa7a5"/><g fill="#e5c6a0" stroke="#a56e50" stroke-width="5"><path d="M40 145V90L65 70 90 90V145Z"/><path d="M100 145V100L125 80 150 100V145Z"/><path d="M160 145V85L185 65 210 85V145Z"/></g></svg>'}<i class="tape tl"></i><i class="tape tr"></i><i class="tape bl"></i><i class="tape br"></i></div>`:''}function post(p){return `<article><small>${esc(p.user)} · ${esc(p.category)} ${p.privacy==='Private'?'· Private':''}</small>${p.user!=='you'?`<button onclick="toggle('follows','${p.user}')">${state.follows.includes(p.user)?'Following':'+ Follow'}</button>`:''}<p><small>DREAM ${p.num} / 100</small></p><h1>${esc(p.title)}</h1>${photo(p)}<p class="entry">${esc(p.entry)}</p>${p.reflection?`<p class="entry">${esc(p.reflection)}</p>`:''}<span class="stamp">${p.status==='Completed'?'✓ I LIVED IT':esc(p.status)}</span><div class="actions"><button onclick="toggle('likes','${p.id}')">${state.likes.includes(p.id)?'♥':'♡'} ${p.likes+Number(state.likes.includes(p.id))}</button><button onclick="comment='${p.id}';render()">Comment</button><button onclick="toggle('saved','${p.id}')">${state.saved.includes(p.id)?'Saved':'Save'}</button><button onclick="${p.user==='you'?`openEdit('${p.id}')`:`collect('${p.id}')`}">${p.user==='you'?'Edit':'+ My 100'}</button></div>${comment===p.id?`<div>${(state.comments[p.id]||[]).map(c=>`<p>${esc(c)}</p>`).join('')}<form onsubmit="addComment(event,'${p.id}')"><input name="comment" required placeholder="Leave encouragement"><button>Post</button></form></div>`:''}</article>`}function addComment(e,id){e.preventDefault();(state.comments[id]??=[]).push(new FormData(e.target).get('comment'));persist();render()}function collect(id){let p=all().find(x=>x.id===id);go('create');seed={title:p.title,category:p.category};render()}function openEdit(id){edit=state.mine.find(p=>p.id===id);seed={};page='create';render()}function slot(n){go('create');seed={num:n};render()}function render(){let m=$('main');if(page==='home'){m.innerHTML=`<div>${['Discover','Following','Saved'].map(t=>`<button onclick="tab='${t}';render()">${t===tab?'✓ ':''}${t}</button>`).join('')}</div>`+all().filter(p=>p.privacy!=='Private'&&(tab==='Discover'||tab==='Following'&&state.follows.includes(p.user)||tab==='Saved'&&state.saved.includes(p.id))).map(post).join('')}else if(page==='explore'){m.innerHTML='<h1>Dream a little.</h1><input placeholder="Search dreams" oninput="search(this.value)"><div id="results"></div>';search('')}else if(page==='journal'){let done=state.mine.filter(p=>p.status==='Completed').length;m.innerHTML=`<article><h1>My 100.</h1><p>${state.mine.length} written · ${done} fulfilled</p><progress max="100" value="${done}" style="width:100%"></progress></article><article>${Array.from({length:100},(_,i)=>{let n=i+1,p=state.mine.find(x=>x.num===n);return `<div class="slot"><span>${n}. ${p?esc(p.title)+(p.privacy==='Private'?' 🔒':''):'An unwritten dream'}</span><button onclick="${p?`openEdit('${p.id}')`:`slot(${n})`}">${p?'Edit':'+'}</button></div>`}).join('')}</article>`}else{let p=edit||seed;if(!free()&&!edit){m.innerHTML='<h1>Your 100 is full.</h1>';return}m.innerHTML=`<h1>${edit?'Revisit your dream':'What do you dream of?'}</h1><article><form onsubmit="saveDream(event)"><label>Dream number</label><select name="num">${Array.from({length:100},(_,i)=>i+1).filter(n=>!state.mine.some(x=>x.num===n)||edit?.num===n).map(n=>`<option ${n===(p.num||free())?'selected':''}>${n}</option>`).join('')}</select><label>Title</label><input name="title" required value="${esc(p.title)}"><label>Category</label><select name="category">${['Travel','Adventure','Creativity','Life','Personal'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select><label>Journal entry</label><textarea name="entry" rows="5" required>${esc(p.entry)}</textarea>${photo(p)}<label>Photo</label><input name="photo" type="file" accept="image/*"><label>Status</label><select name="status">${['Dreaming','In progress','Completed'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select><label>Memory / reflection (optional)</label><textarea name="reflection">${esc(p.reflection)}</textarea><label>Privacy</label><select name="privacy"><option>Private</option><option ${p.privacy==='Public'?'selected':''}>Public</option></select><button class="primary">Save dream</button>${edit?'<button type="button" onclick="removeDream()">Remove dream</button>':''}</form></article>`}}function search(q){$('results').innerHTML=all().filter(p=>p.privacy!=='Private'&&(p.title+' '+p.category).toLowerCase().includes(q.toLowerCase())).map(post).join('')}async function saveDream(e){e.preventDefault();let f=new FormData(e.target),p=Object.fromEntries(f),file=p.photo;p.photo=edit?.photo;if(file.size){if(!file.type.startsWith('image/')||file.size>3000000){alert('Choose an image under 3 MB.');return}p.photo=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}p.num=+p.num;p.id=edit?.id||'m'+Date.now();p.user='you';p.likes=0;if(state.mine.some(x=>x.num===p.num&&x.id!==p.id))return;state.mine=[p,...state.mine.filter(x=>x.id!==p.id)];persist();go('journal')}function removeDream(){if(confirm('Remove this dream?')){state.mine=state.mine.filter(p=>p.id!==edit.id);persist();go('journal')}}render();</script></html>
